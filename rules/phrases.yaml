# Phrases strongly over-represented in unedited LLM marketing copy.
# Matching is case-insensitive on visible page text. A page is flagged only
# when several *distinct* phrases appear at high density (see methodology),
# so one "cutting-edge" in human copy never triggers a finding.
# Contributions welcome; every addition must be justified with examples.
boilerplate:
  # openers and scene-setting
  - in today's fast-paced
  - in today's digital
  - in today's competitive
  - in the ever-evolving
  - ever-evolving
  - ever-changing landscape
  - digital landscape
  - digital age
  - in a world where
  - look no further
  - whether you're a
  - whether you are a
  # promises and power verbs
  - unlock the power
  - unlock the full potential
  - unlock your
  - unleash your
  - unleash the power
  - harness the power
  - elevate your
  - supercharge your
  - revolutionize the way
  - revolutionize your
  - transform the way
  - transform your
  - empower you to
  - empowers you to
  - empowering you
  - take your .{1,30} to the next level
  - reach new heights
  - stay ahead of the curve
  - stand out from the crowd
  # adjectives in stock pairings
  - seamless experience
  - seamlessly integrate
  - seamless integration
  - cutting-edge
  - state-of-the-art
  - game-changer
  - game-changing
  - innovative solutions
  - tailored solutions
  - tailored to your needs
  - robust and scalable
  - user-friendly interface
  - intuitive and user-friendly
  - effortless(?:ly)?
  # metaphors LLMs overuse
  - embark on a journey
  - a testament to
  - rich tapestry
  - delve into
  - navigate the complexities
  - navigate the world of
  - at the forefront of
  - at the heart of
  - a myriad of
  - plethora of
  # hedged service copy
  - designed to help you
  - we're here to help you
  - your trusted partner
  - your one-stop
  - one-stop shop
  - streamline your
  - peace of mind
  - with ease
  - like never before
  - it's not just .{1,30}, it's
  - more than just a
  - dive into
placeholders:
  - lorem ipsum
  - dolor sit amet
  - your company name
  - company name here
  - "\\[your [a-z ]+\\]"
  - example@example\.com
  - "123 main st"
  - "\\(555\\) ?555-"
  - insert text here
# Demo names: common in product mockups and screenshots on purpose, so they
# are a weak signal on their own (low severity, never a score ceiling).
demo_names:
  - john doe
  - jane doe
  - acme (?:corp|inc)
template_leftovers:
  - just another wordpress site
  - hello world!
  - sample page
  - welcome to your new site
  - edit this text
  - add your content here
  - "© \\d{4} your company"
# Defaults a project generator or AI builder puts in the page head. Shipped
# unchanged, they are unambiguous: nobody finished the site. They are checked
# in the markup, so they count even on pages with little text.
scaffold_defaults:
  - {name: "default project title", pattern: '(?i)<title[^>]*>\s*(?:vite \+ (?:react|vue|svelte|preact)(?: \+ ts)?|vite app|react app|create next app|vite_react_shadcn_ts|sveltekit app|my[ -]app|welcome to nuxt!?)\s*</title>'}
  - {name: "generator's default description", pattern: '(?i)<meta[^>]+content="(?:lovable generated project|generated by create next app|web site created using create-react-app|a new nuxt app)"'}
  - {name: "default Vite favicon", pattern: '(?i)<link[^>]+rel="icon"[^>]+href="/vite\.svg"|<link[^>]+href="/vite\.svg"[^>]+rel="icon"'}
  - {name: "builder's default share image", pattern: '(?i)lovable\.dev/opengraph-image|bolt\.new/social_preview'}
scaffold_comments:
  - in a real (?:application|app|implementation|world scenario)
  - this is a (?:simplified|mock|placeholder) (?:implementation|version|example)
  - replace (?:this|with) (?:your|actual) (?:api key|logic|implementation|data)
  - add your (?:own )?(?:logic|code|implementation) here
  - for demonstration purposes
  - mock data for now
  - "todo: implement (?:actual|real|proper)"
# Placeholder values left in source or configuration.
placeholder_config:
  # Only quoted literals count: identifiers such as yourApiKey are fine.
  - "[\"'<]your[_ -]?api[_ -]?key(?:[_ -]?here)?[>\"']"
  - "[\"']YOUR_[A-Z0-9_]+_HERE[\"']"
  - "[\"']<your[-_ ][a-z0-9 _-]+>[\"']"
  - "[\"']replace[_-]?me[\"']"
  - "[\"']changeme[\"']"
  - "[\"']sk-x{8,}[\"']"
  - "https?://api\\.example\\.com"
  - "https?://(?:www\\.)?example\\.com/api"
# AI site builders, detected in markup (generator tags, badges, asset hosts).
builders:
  - {name: Lovable, pattern: '(?i)lovable\.(?:dev|app)|gptengineer\.js|data-lov-id|edit with lovable'}
  - {name: v0, pattern: '(?i)v0\.dev|made with v0|v0-[a-z0-9]{6,}\.vercel\.app'}
  - {name: Bolt.new, pattern: '(?i)bolt\.new|made with bolt|\.bolt\.host'}
  - {name: Framer, pattern: '(?i)<meta[^>]+generator[^>]+framer|framerusercontent\.com|made in framer'}
  - {name: Wix, pattern: '(?i)<meta[^>]+generator[^>]+wix\.com|static\.wixstatic\.com'}
  - {name: Durable, pattern: '(?i)durable\.co|built with durable'}
  - {name: 10Web, pattern: '(?i)10web\.io|10web ai builder'}
  - {name: Hostinger AI Website Builder, pattern: '(?i)<meta[^>]+generator[^>]+hostinger|zyrosite\.com|zyro\.com'}
  - {name: Base44, pattern: '(?i)base44\.(?:com|app)'}
