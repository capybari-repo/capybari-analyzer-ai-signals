id: ai-signals
name: AI-Generation Signals
version: 0.3.0
category: ai
summary: Collects indicators of unreviewed AI-generated work. Websites (front page and up to 5 linked pages) - 67 stock marketing phrases, live placeholders, template leftovers, AI site-builder fingerprints. Repositories - AI assistant configs, builder markers, scaffolding comments, swallowed errors and placeholder configuration. Its evidence feeds the AI Slop Score, a composite computed by capybari-core. Indicators, not proof.
stability: experimental
core_api: v0
targets: [website, repository]
optional: [web-snapshot, inventory, technologies]
findings: [ai-boilerplate, placeholder-content, ai-builder, template-leftover, scaffold-code, swallowed-errors, placeholder-config, ai-assistant-config]
scores: []
cost: low
execution:
  local: true
  network: none
  ai: none
privacy: Runs on evidence already collected (the fetched pages or the local files). Nothing is sent anywhere, and no AI model is used.
methodology: https://github.com/capybari-repo/capybari-analyzer-ai-signals/blob/main/docs/methodology.md
follow_ups:
  - capability: web-security
    reason: Separate AI-use indicators from actual quality; check the site's real security configuration.
  - capability: web-tech
    reason: Identify the builder and components behind the site.
  - capability: code-health
    reason: Check whether the generated-looking code is also complex or duplicated.
    when:
      finding_categories: [scaffold-code]
